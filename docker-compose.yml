services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: webtuyendung-ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - webtuyendung-net

  backend:
    build:
      context: ./AppTuyenDung
      dockerfile: Dockerfile
    container_name: webtuyendung-be
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - webtuyendung-net

  frontend:
    build:
      context: ./fe-tuyendung
      dockerfile: Dockerfile
    container_name: webtuyendung-fe
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - webtuyendung-net

networks:
  webtuyendung-net:
    driver: bridge
