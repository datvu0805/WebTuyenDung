server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls đến backend
    location /AppTuyenDung/ {
        proxy_pass http://backend:8080/AppTuyenDung/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path /AppTuyenDung /AppTuyenDung;
        proxy_cookie_domain backend localhost;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # SPA fallback — mọi route đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
